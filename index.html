<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вместе на всегда</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="word-field" aria-hidden="true"></div>

<header class="topbar">
  <div class="logo">Б<span></span> + Н<span></span></div>
  <details class="catalog">
    <summary>Каталог ▾</summary>
    <div class="menu">
      <a href="photos.html">Фотографии</a>
      <a href="history.html">История</a>
      <a href="nicknames.html">Как они себя называют</a>
    </div>
  </details>
</header>

<main class="hero">
  <div class="hero-photo">
    <img src="photos/hero.jpeg" alt="Батырхан и Назерке">

    <div class="timer-plaque">
      <p class="timer-label">Вместе уже</p>
      <div class="timer-grid" id="timer">
        <div class="tcell"><span id="t-years">0</span><small>лет</small></div>
        <div class="tcell"><span id="t-months">0</span><small>мес.</small></div>
        <div class="tcell"><span id="t-days">0</span><small>дней</small></div>
        <div class="tcell"><span id="t-hours">00</span><small>час.</small></div>
        <div class="tcell"><span id="t-minutes">00</span><small>мин.</small></div>
        <div class="tcell"><span id="t-seconds">00</span><small>сек.</small></div>
      </div>
    </div>

    <p class="hero-caption">Батырхан <span class="plus">+</span> Назерке <span class="heart">&#9829;</span></p>
  </div>

  <div class="hero-date">
    <span class="date-eyebrow">История началась</span>
    <p class="date-big">03.10.2025</p>
    <p class="date-sub">Начало большой истории двоих</p>
  </div>
</main>

<footer class="site-footer">сделано с любовью </footer>

<script src="script.js"></script>
</body>
</html>
